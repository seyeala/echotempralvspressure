name: Fin_res Stage5 2C release bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finres-stage5-2c-release-bridge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: finres-stage5-2c-transfer-20260828
    steps:
      - name: Download and verify bridge files
        shell: bash
        run: |
          set -euo pipefail
          mkdir bridge
          cd bridge
          BASE='https://filebin.net/finres-stage5-2c-41e7e3c8f5fd'
          curl -fL --retry 10 --retry-all-errors --retry-delay 5 "$BASE/Fin_res_STAGE5_2C_chunk1.zip" -o Fin_res_STAGE5_2C_chunk1.zip
          curl -fL --retry 10 --retry-all-errors --retry-delay 5 "$BASE/Fin_res_STAGE5_2C_chunk2.zip" -o Fin_res_STAGE5_2C_chunk2.zip
          curl -fL --retry 10 --retry-all-errors --retry-delay 5 "$BASE/Fin_res_STAGE5_2C_chunk3.zip" -o Fin_res_STAGE5_2C_chunk3.zip
          curl -fL --retry 10 --retry-all-errors --retry-delay 5 "$BASE/Fin_res_STAGE5_2C_execution_control.zip" -o Fin_res_STAGE5_2C_execution_control.zip
          curl -fL --retry 10 --retry-all-errors --retry-delay 5 "$BASE/STAGE5_2C_BRIDGE_SUMMARY.json" -o STAGE5_2C_BRIDGE_SUMMARY.json
          cat > SHA256SUMS.txt <<'EOF'
          5d43f743cc85cf62fe8a10773ed57a78624977ff4e00d5dee7667b6de775f531  Fin_res_STAGE5_2C_chunk1.zip
          a975a5bf7f1d9dc0aa1b6e3a0d543a3de1d606d68427b457854d69bf00db7cd7  Fin_res_STAGE5_2C_chunk2.zip
          024e960d82a63012c6a2521d7aefec8504d3117c01de92c9de0ea8e8dc629101  Fin_res_STAGE5_2C_chunk3.zip
          96d3bca8018c80908dacdbabb82d1f731b37eb3d85f9c6e7380ab261b00182b5  Fin_res_STAGE5_2C_execution_control.zip
          9cd97420ac585872eb00680af3cac0c9992bd8b51a4cae79e92cf11530754d1e  STAGE5_2C_BRIDGE_SUMMARY.json
          EOF
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import json,zipfile
          expected={
            'Fin_res_STAGE5_2C_chunk1.zip':343219654,
            'Fin_res_STAGE5_2C_chunk2.zip':341550065,
            'Fin_res_STAGE5_2C_chunk3.zip':186319214,
            'Fin_res_STAGE5_2C_execution_control.zip':1383948,
            'STAGE5_2C_BRIDGE_SUMMARY.json':27559,
          }
          from pathlib import Path
          for name,size in expected.items(): assert Path(name).stat().st_size==size,(name,Path(name).stat().st_size)
          for name in [n for n in expected if n.endswith('.zip')]:
            with zipfile.ZipFile(name) as z: assert z.testzip() is None,name
          d=json.load(open('STAGE5_2C_BRIDGE_SUMMARY.json'))
          assert d['status']=='pass' and d['transport_summary']['transport_objects']==31 and d['transport_summary']['accessions']==1983
          PY
      - name: Create temporary public release
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          git init tmprepo
          cd tmprepo
          git config user.email actions@github.com
          git config user.name github-actions
          git commit --allow-empty -m bridge
          git tag "$TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          cd ..
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Temporary Fin_res Stage 5.2C transfer' --notes 'Hash-verified transfer bridge. Delete after Google Drive certification.'
          gh release upload "$TAG" bridge/Fin_res_STAGE5_2C_chunk1.zip bridge/Fin_res_STAGE5_2C_chunk2.zip bridge/Fin_res_STAGE5_2C_chunk3.zip bridge/Fin_res_STAGE5_2C_execution_control.zip bridge/STAGE5_2C_BRIDGE_SUMMARY.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url,tagName > release.json
          python - <<'PY'
          import json
          d=json.load(open('release.json'))
          expected={
            'Fin_res_STAGE5_2C_chunk1.zip':343219654,
            'Fin_res_STAGE5_2C_chunk2.zip':341550065,
            'Fin_res_STAGE5_2C_chunk3.zip':186319214,
            'Fin_res_STAGE5_2C_execution_control.zip':1383948,
            'STAGE5_2C_BRIDGE_SUMMARY.json':27559,
          }
          got={a['name']:a['size'] for a in d['assets']}
          assert got==expected,(got,expected)
          print(json.dumps(d,indent=2))
          PY
